keys:
  # Personal key so you can create/edit secrets from your workstation.
  # Generate with: age-keygen -o ~/.config/sops/age/keys.txt
  - &admin_jonathan age1REPLACE_WITH_YOUR_PERSONAL_AGE_PUBLIC_KEY

  # Host keys, derived from each machine's existing SSH host key so no
  # separate age key needs to be provisioned or rotated:
  #   nix run nixpkgs#ssh-to-age -- < /etc/ssh/ssh_host_ed25519_key.pub
  - &host_homelab age1REPLACE_WITH_HOMELAB_HOST_AGE_PUBLIC_KEY

creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *admin_jonathan
          - *host_homelab
