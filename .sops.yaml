keys:
  # Personal key so you can create/edit secrets from your workstation.
  # Generate with: age-keygen -o ~/.config/sops/age/keys.txt
  - &admin_jonathan age1REPLACE_WITH_YOUR_PERSONAL_AGE_PUBLIC_KEY

  # Per-host keys. Each host decrypts with its own dedicated age key at
  # /var/lib/sops-nix/key.txt (see modules/features/sops.nix); these are the
  # matching public keys. Generate with:
  #   age-keygen -o key.txt   # prints the age1... public key
  - &host_homelab age1REPLACE_WITH_HOMELAB_HOST_AGE_PUBLIC_KEY

creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *admin_jonathan
          - *host_homelab
